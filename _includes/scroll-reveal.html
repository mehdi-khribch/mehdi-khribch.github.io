<style>
  @media (prefers-reduced-motion: no-preference) {
    .reveal-init { opacity: 0; transform: translateY(14px); }
    .reveal-in   { opacity: 1; transform: none;
                   transition: opacity 0.6s ease, transform 0.6s ease; }
  }
</style>
<script>
  (function () {
    var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq && mq.matches) return;                 // respect reduced-motion
    if (!('IntersectionObserver' in window)) return;

    var sel = [
      '#quarto-document-content > *',
      '.about-main h2', '.about-main p',
      '.photo-frame', '.about-links', '.hero-name',
      '.pub-item', '.talk-item', '.edu-entry',
      '.painting-section',
      '.quarto-listing .g-col-1', '.quarto-listing .card'
    ].join(',');

    var els = Array.prototype.slice.call(document.querySelectorAll(sel));
    if (!els.length) return;

    // Only hide via JS, so content stays visible if scripts are disabled.
    els.forEach(function (el) { el.classList.add('reveal-init'); });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add('reveal-in');
          e.target.classList.remove('reveal-init');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });

    els.forEach(function (el) { io.observe(el); });
  })();

  // Per-page mellowed, colorless painting background (uses this page's own art).
  (function () {
    var art = document.querySelector('.featured-painting, .painting-section img');
    if (!art) return;
    var src = art.currentSrc || art.getAttribute('src');
    if (!src) return;
    var bg = document.createElement('div');
    bg.className = 'page-bg';
    bg.style.backgroundImage = 'url("' + src + '")';
    document.body.insertBefore(bg, document.body.firstChild);
  })();
</script>
